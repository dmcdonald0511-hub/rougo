<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Rougo sign-in</title>
<style>body{font:16px -apple-system,system-ui,sans-serif;background:#0b1530;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0;padding:16px;text-align:center}</style>
</head><body><p id="m">Finishing TikTok sign-in…</p>
<script>
// TikTok will not return to a localhost address, so this page hands the sign-in result
// back to the Rougo Growth OS app running on the owner's own computer. It only ever
// forwards to that one fixed local address, and keeps nothing.
(function () {
  var q = new URLSearchParams(location.search), out = new URLSearchParams();
  ["code", "state", "error", "error_description", "scopes"].forEach(function (k) { if (q.has(k)) out.set(k, q.get(k)); });
  if (!out.has("state")) { document.getElementById("m").textContent = "Nothing to do here."; return; }
  location.replace("http://localhost:8010/api/integrations/tiktok/callback?" + out.toString());
})();
</script></body></html>
